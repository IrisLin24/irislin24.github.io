<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IrisLin24 的个人主页</title>
  <style>
    :root {
      font-family: system-ui, "Microsoft YaHei", sans-serif;
      color: #143334;
      background: #edf4f3;
      line-height: 1.7;
    }

    body { margin: 0; }

    .page {
      width: min(100% - 2.5rem, 48rem);
      margin-inline: auto;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.5rem;
      padding-block: 1.25rem;
      border-bottom: 1px solid #bbcfc9;
    }

    a {
      color: #245d58;
      text-underline-offset: 0.25em;
    }

    a:focus-visible {
      outline: 2px solid #245d58;
      outline-offset: 4px;
    }

    header { padding-block: clamp(3rem, 10vw, 7rem); }

    h1, h2, h3 { line-height: 1.2; }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 5rem);
      letter-spacing: -0.045em;
    }

    header p {
      max-width: 34rem;
      font-size: 1.125rem;
      color: #3d5555;
    }

    section {
      padding-block: 1.5rem 2rem;
      border-top: 1px solid #bbcfc9;
    }

    h2 { margin-top: 0; }

    article {
      padding: 1.25rem;
      background: #fff;
      border: 1px solid #ceded9;
      border-radius: 0.75rem;
    }

    article h3 { margin: 0 0 0.5rem; }
    article p { margin: 0; }
  </style>
</head>
<body>
  <div class="page">
    <nav aria-label="页面导航">
      <a href="#about">关于我</a>
      <a href="#projects">作品</a>
      <a href="https://github.com/IrisLin24">GitHub</a>
    </nav>

    <main>
      <header>
        <!-- 可以把下面的用户名替换成想公开展示的名字或昵称。 -->
        <h1>你好，我是 IrisLin24</h1>
        <p>用一句话介绍你自己，比如你正在学习什么，或者喜欢做什么。</p>
      </header>

      <section id="about">
        <h2>关于我</h2>
        <p>在这里写两三句话，介绍你的兴趣、经历或最近在做的事。</p>
      </section>

      <section id="projects">
        <h2>作品</h2>
        <article>
          <h3>你的第一个项目</h3>
          <p>写下你做了什么、用到了什么，以及这个项目里你最想展示的部分。</p>
        </article>
      </section>
    </main>
  </div>
</body>
</html>
